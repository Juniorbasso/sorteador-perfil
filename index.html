<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteador - Perfil Moderno</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Estilos baseados na carta física */
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #2c3e50; /* Fundo escuro para destacar a carta branca */
        }
        
        .carta {
            background-color: #f9f9f9;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            /* Textura super sutil para parecer papel */
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23noise)' opacity='0.05'/%3E%3C/svg%3E");
        }

        .cabecalho-carta {
            background-color: #d1d5db; /* Cinza claro da barra superior */
            border-top: 4px solid #f9f9f9;
            border-left: 4px solid #f9f9f9;
            border-right: 4px solid #f9f9f9;
        }

        .tag-categoria {
            background-color: #6b7280; /* Cinza escuro da tag */
        }

        /* Classe para esconder a resposta */
        .resposta-oculta {
            filter: blur(6px);
            background-color: #9ca3af;
            color: transparent;
            user-select: none;
            transition: all 0.3s ease;
        }

        .resposta-revelada {
            filter: blur(0);
            background-color: transparent;
            color: #111827;
        }

        /* Estilo da lista ordenada para ficar igual ao jogo original */
        ol {
            counter-reset: item;
            list-style-type: none;
            padding-left: 0;
        }
        
        ol li {
            display: flex;
            margin-bottom: 4px;
            font-size: 0.95rem;
            line-height: 1.3;
            color: #1a1a1a;
        }
        
        ol li::before {
            content: counter(item) ". ";
            counter-increment: item;
            margin-right: 8px;
            font-weight: normal;
            min-width: 20px;
            text-align: right;
        }

        /* Animação de loading */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-10 px-4">

    <!-- Botão Principal -->
    <button id="btn-pescar" onclick="gerarNovaCarta()" class="mb-8 bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 px-8 rounded-full shadow-lg transform transition hover:scale-105 active:scale-95 text-lg uppercase tracking-wider">
        🃏 Pescar Nova Carta
    </button>

    <!-- Container da Carta -->
    <div id="carta-container" class="carta w-full max-w-[450px] rounded-md p-4 relative hidden">
        
        <!-- Cabeçalho (Categoria e Resposta) -->
        <div class="cabecalho-carta flex items-center p-2 mb-4 shadow-sm">
            <span id="txt-categoria" class="tag-categoria text-white font-bold px-3 py-1 text-lg uppercase tracking-wide">
                COISA
            </span>
            <span id="txt-resposta" onclick="revelarResposta()" class="ml-3 font-bold text-lg uppercase cursor-pointer resposta-oculta px-2 rounded" title="Clique para revelar">
                RESPOSTA SECRETA
            </span>
        </div>

        <!-- Corpo (Dicas) -->
        <ol id="lista-dicas" class="px-2">
            <!-- As dicas serão inseridas aqui via JavaScript -->
        </ol>
    </div>

    <!-- Tela de Carregamento -->
    <div id="loading-container" class="flex flex-col items-center justify-center mt-10 hidden bg-white p-8 rounded-xl shadow-lg max-w-[450px] w-full">
        <div class="loader mb-4"></div>
        <p class="text-gray-700 font-bold text-center">A IA está pensando em um tema moderno e gerando as dicas...</p>
        <p class="text-gray-500 text-sm mt-2 text-center">Isso pode levar alguns segundos.</p>
    </div>

    <!-- Mensagem de Erro -->
    <div id="erro-container" class="hidden mt-10 bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative max-w-[450px] w-full text-center">
        <strong class="font-bold">Oops!</strong>
        <span class="block sm:inline"> Houve um erro ao gerar a carta. Tente pescar novamente.</span>
    </div>

    <script>
        // Chave da API (deixada em branco para o ambiente Canvas injetar automaticamente)
        const apiKey = "";
        
        // Elementos da DOM
        const btnPescar = document.getElementById('btn-pescar');
        const cartaContainer = document.getElementById('carta-container');
        const loadingContainer = document.getElementById('loading-container');
        const erroContainer = document.getElementById('erro-container');
        
        const txtCategoria = document.getElementById('txt-categoria');
        const txtResposta = document.getElementById('txt-resposta');
        const listaDicas = document.getElementById('lista-dicas');

        // Função para revelar a resposta ao clicar
        function revelarResposta() {
            txtResposta.classList.remove('resposta-oculta');
            txtResposta.classList.add('resposta-revelada');
        }

        // Função para esconder a resposta quando uma nova carta for gerada
        function esconderResposta() {
            txtResposta.classList.remove('resposta-revelada');
            txtResposta.classList.add('resposta-oculta');
        }

        // Função principal que chama a API do Gemini
        async function gerarNovaCarta() {
            // Atualiza UI para estado de carregamento
            cartaContainer.classList.add('hidden');
            erroContainer.classList.add('hidden');
            loadingContainer.classList.remove('hidden');
            btnPescar.disabled = true;
            btnPescar.classList.add('opacity-50', 'cursor-not-allowed');

            const prompt = `Gere uma carta de adivinhação. Retorne APENAS um JSON válido no formato: { "categoria": "...", "resposta": "...", "dicas": ["...", ...] }. A "categoria" deve ser escolhida aleatoriamente entre: COISA, DIGITAL, LUGAR, PESSOA, ANO. A "resposta" deve ser um tema moderno e atualizado (por exemplo: influenciadores atuais, tecnologias recentes, memes, séries novas, etc). "dicas" deve ser um array com exatamente 20 strings. As strings devem ser dicas curtas sobre a resposta, estruturadas na primeira pessoa (ex: "Sou...", "Fui...", "Nasci..."), indo das mais vagas e difíceis para as mais óbvias. Importante: substitua aleatoriamente de 2 a 3 dessas dicas por ações do jogo de tabuleiro, como "Perca sua vez." ou "Avance 3 espaços." ou "Volte 1 casa." ou "Jogue novamente."`;

            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                generationConfig: {
                    responseMimeType: "application/json",
                    responseSchema: {
                        type: "OBJECT",
                        properties: {
                            categoria: { 
                                type: "STRING", 
                                description: "A categoria da carta.",
                                enum: ["COISA", "DIGITAL", "LUGAR", "PESSOA", "ANO"] 
                            },
                            resposta: { 
                                type: "STRING",
                                description: "A resposta secreta da carta."
                            },
                            dicas: { 
                                type: "ARRAY", 
                                items: { type: "STRING" },
                                description: "Exatamente 20 dicas."
                            }
                        },
                        required: ["categoria", "resposta", "dicas"]
                    }
                }
            };

            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error(`Erro na requisição: ${response.status}`);
                }

                const result = await response.json();
                
                if (result.candidates && result.candidates.length > 0 &&
                    result.candidates[0].content && result.candidates[0].content.parts &&
                    result.candidates[0].content.parts.length > 0) {
                    
                    const jsonString = result.candidates[0].content.parts[0].text;
                    const dadosCarta = JSON.parse(jsonString);
                    
                    renderizarCarta(dadosCarta);
                    
                } else {
                    throw new Error("Estrutura de resposta inesperada da API.");
                }

            } catch (error) {
                console.error("Erro ao gerar carta:", error);
                erroContainer.classList.remove('hidden');
                loadingContainer.classList.add('hidden');
            } finally {
                // Restaura o botão
                btnPescar.disabled = false;
                btnPescar.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }

        // Função para preencher o HTML com os dados da API
        function renderizarCarta(dados) {
            // Oculta loading
            loadingContainer.classList.add('hidden');
            
            // Atualiza cabeçalho
            txtCategoria.innerText = dados.categoria;
            txtResposta.innerText = dados.resposta;
            esconderResposta(); // Garante que começa escondida

            // Limpa a lista atual e insere as 20 dicas
            listaDicas.innerHTML = '';
            
            // Garante que mostre no máximo 20, caso a IA erre (embora o schema ajude a evitar)
            const dicasLimitadas = dados.dicas.slice(0, 20);
            
            dicasLimitadas.forEach(dica => {
                const li = document.createElement('li');
                li.innerText = dica;
                listaDicas.appendChild(li);
            });

            // Mostra a carta
            cartaContainer.classList.remove('hidden');
        }

        // Inicia o app gerando a primeira carta automaticamente
        window.onload = function() {
            gerarNovaCarta();
        };
    </script>
</body>
</html>
