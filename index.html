<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteador - Perfil 7</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        .btn-pescar {
            background-color: #d32f2f;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            text-transform: uppercase;
        }
        .btn-pescar:hover { background-color: #b71c1c; }
        
        /* Estilo idêntico à carta física */
        .carta {
            background-color: #e4e6e3; /* Cor de papel reciclado claro */
            width: 100%;
            max-width: 380px;
            padding: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            display: none; /* Escondido até pescar */
            color: #222;
        }
        .cabecalho {
            display: flex;
            align-items: stretch;
            margin-bottom: 15px;
        }
        .categoria {
            background-color: #5a5c5f;
            color: white;
            padding: 6px 12px;
            font-weight: 900;
            font-size: 1.3rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .resposta {
            background-color: #c4c5c0;
            color: #333;
            padding: 6px 12px;
            font-weight: 900;
            font-size: 1.3rem;
            text-transform: uppercase;
            flex-grow: 1;
            text-align: left;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        /* Classe para esconder a resposta para o mediador não mostrar sem querer */
        .escondido {
            color: transparent;
            text-shadow: 0 0 12px rgba(0,0,0,0.6);
        }
        .dicas-lista {
            list-style-type: decimal;
            padding-left: 25px;
            margin: 0;
        }
        .dicas-lista li {
            margin-bottom: 4px;
            font-size: 0.95rem;
            line-height: 1.3;
            letter-spacing: -0.2px;
        }
        .instrucao {
            color: #888;
            font-size: 0.8rem;
            text-align: center;
            margin-top: 15px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <button class="btn-pescar" onclick="pescarCarta()">Pescar Carta</button>

    <div class="carta" id="carta-container">
        <div class="cabecalho">
            <div class="categoria" id="categoria"></div>
            <div class="resposta escondido" id="resposta" onclick="alternarResposta()"></div>
        </div>
        
        <ol class="dicas-lista" id="dicas-container">
            <!-- As 20 dicas entrarão aqui -->
        </ol>

        <div class="instrucao">Toque na tarja cinzenta ao lado da categoria para revelar/esconder a resposta.</div>
    </div>

    <script>
        // Banco de dados com cartas atualizadas. Pode adicionar centenas aqui seguindo a mesma estrutura.
        const baralho = [
            {
                categoria: "DIGITAL",
                resposta: "TIKTOK",
                dicas: [
                    "Fui lançado globalmente em 2017.",
                    "Sou um aplicativo para smartphones.",
                    "Minha empresa matriz é chinesa (ByteDance).",
                    "Meu formato principal é de vídeos curtos verticais.",
                    "Fiquei muito famoso por dancinhas e desafios.",
                    "Perca sua vez.",
                    "Tenho um algoritmo poderoso chamado 'For You' (Para Você).",
                    "Ajudei a popularizar muitas músicas que estouraram nas paradas.",
                    "Pessoas de todas as idades me usam, mas sou febre na Geração Z.",
                    "Meu logotipo tem o formato de uma nota musical.",
                    "Avance 3 espaços.",
                    "Tive problemas de regulamentação em alguns países.",
                    "Concorro diretamente com o Reels do Instagram.",
                    "Os criadores de conteúdo na minha plataforma ganharam meu nome acrescido de 'ers'.",
                    "Permito fazer 'duetos' com vídeos de outras pessoas.",
                    "Perca sua vez.",
                    "O ecrã rola infinitamente para cima.",
                    "Fui fundido com o aplicativo Musical.ly nos meus primórdios.",
                    "Fui um dos apps mais descarregados da década de 2020.",
                    "Substituí a febre que antigamente era o Vine."
                ]
            },
            {
                categoria: "ANO",
                resposta: "2020",
                dicas: [
                    "Fui um ano bissexto.",
                    "Fiquei marcado na história mundial recente.",
                    "Perca sua vez.",
                    "Ocorreu o início de um confinamento global.",
                    "O teletrabalho tornou-se regra para muitas empresas.",
                    "Uma pandemia foi declarada neste período pela OMS.",
                    "As Olimpíadas de Tóquio que aconteceriam em mim foram adiadas.",
                    "Avance 2 espaços.",
                    "Lives musicais no YouTube bateram recordes de audiência.",
                    "Ocorreram eleições presidenciais nos Estados Unidos (Biden vs Trump).",
                    "O Oscar de Melhor Filme foi para uma longa-metragem sul-coreana (Parasita).",
                    "Fui o ano de lançamento dos consolas PlayStation 5 e Xbox Series X/S.",
                    "Houve uma nuvem de gafanhotos assustando países da América do Sul.",
                    "A rede social TikTok teve sua grande explosão mundial de utilizadores.",
                    "Perca sua vez.",
                    "Notas de 200 reais começaram a circular no Brasil.",
                    "O mundo inteiro usou máscaras para sair de casa.",
                    "Aconteceu a explosão no porto de Beirute, no Líbano.",
                    "O filme 'Pantera Negra' perdeu o seu protagonista, Chadwick Boseman.",
                    "Fui o ano em que o vírus SARS-CoV-2 mudou o mundo."
                ]
            },
            {
                categoria: "COISA",
                resposta: "PASTEL",
                dicas: [
                    "Posso ser folhado.",
                    "Sou um alimento muito comum em feiras populares do Brasil.",
                    "Posso substituir refeições.",
                    "Um palpite a qualquer hora.",
                    "Costumo soltar uma fumacinha logo que sou mordido.",
                    "Tenho vários sabores.",
                    "Posso ser de vento.",
                    "Os portugueses é que me deram a forma atual.",
                    "Posso ser assado.",
                    "Posso ser de Belém.",
                    "Normalmente sou frito.",
                    "Perca sua vez.",
                    "Posso ser encontrado pronto no supermercado, para ser frito em casa.",
                    "Faço uma boa dupla com o caldo de cana.",
                    "Minha massa pode ser fina ou grossa.",
                    "Sou crocante e saboroso.",
                    "Também posso ser congelado.",
                    "Avance 3 espaços.",
                    "Tenho muitas calorias.",
                    "Não sou recomendado para pessoas com colesterol alto."
                ]
            }
        ];

        function pescarCarta() {
            // Sorteia uma carta aleatória do baralho
            const indexAleatorio = Math.floor(Math.random() * baralho.length);
            const cartaSorteada = baralho[indexAleatorio];

            // Preenche o cabeçalho
            document.getElementById('categoria').innerText = cartaSorteada.categoria;
            
            const elementoResposta = document.getElementById('resposta');
            elementoResposta.innerText = cartaSorteada.resposta;
            // Garante que a resposta venha escondida na nova pesca
            if (!elementoResposta.classList.contains('escondido')) {
                elementoResposta.classList.add('escondido');
            }

            // Limpa as dicas anteriores e injeta as 20 novas dicas
            const listaDicas = document.getElementById('dicas-container');
            listaDicas.innerHTML = '';
            
            cartaSorteada.dicas.forEach(dica => {
                const li = document.createElement('li');
                li.innerText = dica;
                listaDicas.appendChild(li);
            });

            // Exibe o cartão na tela
            document.getElementById('carta-container').style.display = 'block';
        }

        function alternarResposta() {
            const elementoResposta = document.getElementById('resposta');
            elementoResposta.classList.toggle('escondido');
        }
    </script>
</body>
</html>
